name: abuse
path: security/abuse
layer: stable
status: ga
owner: security
risk: high
summary: Sharded rate limiter with sliding-window counters for abuse detection at the primitive level.

strict_boundary: auth_primitives

responsibilities:
  - Provide a sharded, concurrent-safe rate limiter
  - Support sliding-window and fixed-window strategies
  - Export decision metadata for response header construction

non_goals:
  - HTTP middleware adaptation (belongs in middleware/abuseguard)
  - Persistent rate limit state or distributed coordination
  - Per-tenant or per-route rate limit policy

public_entrypoints:
  - NewLimiter
  - NewLimiterWithConfig
  - Limiter
  - Config
  - Decision
  - LimiterMetrics
  - DefaultConfig

allowed_imports:
  - stdlib

forbidden_imports:
  - core/**
  - router/**
  - store/**
  - x/**

test_commands:
  - go test -race -timeout 30s ./security/abuse/...
  - go vet ./security/abuse/...

review_checklist:
  - Must be safe for concurrent use
  - Rate limit decisions must be deterministic
  - Keep responsibility at the primitive level

agent_hints:
  - HTTP adaptation of abuse primitives belongs in middleware/abuseguard
  - Per-tenant rate limiting belongs in x/tenant, not here