name: "CodeQL Config"

paths-ignore:
  - 'examples/**'
  - 'docs/**'

queries:
  - uses: security-and-quality

# Suppress false positive XSS alerts for middleware infrastructure
# These files are part of the response processing pipeline and pass through
# response data without injecting user input into HTML contexts.
#
# For actual HTML escaping, use internal/httputil helpers:
# - internal/httputil.HTMLEscape() for HTML content
# - internal/httputil.SanitizeHTML() for basic HTML sanitization
